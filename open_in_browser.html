<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexCorp Portal - Browser Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 24px;
        }
        .launcher-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            max-width: 580px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .icon-badge {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.4);
        }
        h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 28px; }
        .countdown-banner {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 26px;
            font-size: 0.92rem;
            color: #93c5fd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .opt-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .opt-btn:hover {
            background: rgba(37, 99, 235, 0.25);
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }
        .opt-btn.edge-primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        .opt-btn.edge-primary:hover {
            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
            transform: translateY(-2px);
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn-content i { font-size: 1.25rem; }
        .arrow-icon { color: #94a3b8; }
        .footer-note {
            font-size: 0.82rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="launcher-card">
    <div class="icon-badge">
        <i class="fa-solid fa-rocket"></i>
    </div>
    <h1>Open ApexCorp Web Portal</h1>
    <p class="subtitle">Where would you like to open the project?</p>

    <div class="countdown-banner" id="countdownBox">
        <span><i class="fa-solid fa-clock"></i> Auto-opening in Microsoft Edge in <strong id="timer">3</strong>s...</span>
        <button onclick="cancelTimer()" style="background: none; border: none; color: #f87171; cursor: pointer; font-size: 0.82rem; font-weight: 700; text-decoration: underline;">Cancel Timer</button>
    </div>

    <div class="options-list">
        <!-- Direct Edge -->
        <a href="http://localhost/company/index.php" class="opt-btn edge-primary" id="edgeLink">
            <div class="btn-content">
                <i class="fa-brands fa-edge"></i>
                <span>Open in Microsoft Edge (Recommended)</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon" style="color: white;"></i>
        </a>

        <!-- Login directly -->
        <a href="http://localhost/company/login.php" class="opt-btn">
            <div class="btn-content">
                <i class="fa-solid fa-key" style="color: #60a5fa;"></i>
                <span>Portal Login (Employee & Admin)</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <!-- Register -->
        <a href="http://localhost/company/register.php" class="opt-btn">
            <div class="btn-content">
                <i class="fa-solid fa-user-plus" style="color: #34d399;"></i>
                <span>Staff Registration Form</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <!-- phpMyAdmin -->
        <a href="http://localhost/phpmyadmin/" class="opt-btn">
            <div class="btn-content">
                <i class="fa-solid fa-database" style="color: #f59e0b;"></i>
                <span>phpMyAdmin Database (company_db)</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>
    </div>

    <div class="footer-note">
        Requires XAMPP Apache & MySQL to be running.
    </div>
</div>

<script>
    let secondsLeft = 3;
    let timerInterval = null;
    const timerSpan = document.getElementById('timer');
    const countdownBox = document.getElementById('countdownBox');

    function startTimer() {
        timerInterval = setInterval(() => {
            secondsLeft--;
            if (timerSpan) timerSpan.textContent = secondsLeft;
            if (secondsLeft <= 0) {
                clearInterval(timerInterval);
                window.location.href = "http://localhost/company/index.php";
            }
        }, 1000);
    }

    function cancelTimer() {
        clearInterval(timerInterval);
        countdownBox.innerHTML = '<span>Auto-open paused. Please choose an option below:</span>';
    }

    startTimer();
</script>

</body>
</html>
